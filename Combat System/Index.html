<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combat System</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <section id="big-container">
            <div id="player">
                <img src="Img/Ghost-charc.svg" alt="player">
                <div id="PShield"></div>
                <div id="Health-bar-player">
                   <div id="player-Outer-Line">
                    <div id="player-inner-Line"></div>
                   </div>
                </div>
            </div>
            <div id="enemy">
                <img src="Img/AI-Boss.svg" alt="enemy">

                <div id="EShield"></div>

                <div id="Health-bar-enemy">
                    <div id="enemy-Outer-Line">
                    <div id="enemy-inner-Line"></div>   
                    </div>
                </div>
            </div>
            <div id="Bullet" class="bullet"></div>
            <div id="PBullet" class="Pbullet"></div>
    </section>
</body>
<script src="Script.js"></script>
</html>
